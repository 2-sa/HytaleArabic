name: Publish Windows installer and portable archive

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        id: version
        shell: pwsh
        run: |
          $version = "0.7.2.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Validate translation source
        shell: powershell
        run: |
          .\tests\Test-Catalogs.ps1
          .\tools\Test-MigrateTranslationSource.ps1
          .\tests\Test-GitHubUpdater.ps1
          foreach ($file in Get-ChildItem .\tools,.\tests -Filter '*.ps1' -Recurse -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Invalid PowerShell script: $($file.FullName)" }
          }
      - name: Build installer
        shell: powershell
        run: .\tools\Build-Installer.ps1 -OutputPath ".\dist\HytaleArabicInstaller-${{ steps.version.outputs.version }}.exe" -AppVersion "${{ steps.version.outputs.version }}"
      - name: Verify installer payload
        shell: powershell
        run: |
          $installer = (Resolve-Path ".\dist\HytaleArabicInstaller-${{ steps.version.outputs.version }}.exe").Path
          $extract = Join-Path (Get-Location).Path 'build\release-extraction'
          $process = Start-Process -FilePath $installer -ArgumentList @('--test-extract', $extract) -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Extraction failed: $($process.ExitCode)" }
          if (!(Test-Path -LiteralPath (Join-Path $extract '.test-result'))) { throw 'Extraction result missing.' }
          foreach ($required in @('HytaleArabicManager.exe','src\client.lang','src\server.lang','tools\PrepareOnDevice.ps1','tools\baseline-0.7.2.json')) {
            if (!(Test-Path -LiteralPath (Join-Path $extract $required))) { throw "Payload file missing: $required" }
          }
          if (Test-Path -LiteralPath (Join-Path $extract 'package')) { throw 'Release unexpectedly contains game assets.' }
          $version = [Reflection.AssemblyName]::GetAssemblyName($installer).Version.ToString()
          if ($version -ne '${{ steps.version.outputs.version }}') { throw "Unexpected installer version: $version" }
          .\tests\Test-InstallerWait.ps1 -InstallerPath $installer
      - name: Build and verify portable archive
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = '${{ steps.version.outputs.version }}'
          $installer = ".\dist\HytaleArabicInstaller-$version.exe"
          $portable = ".\dist\HytaleArabicPortable-$version.zip"
          .\tools\Build-Portable.ps1 -InstallerPath $installer -OutputPath $portable
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $portable).Path)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($required in @('HytaleArabicManager.exe','src/client.lang','src/server.lang','tools/PrepareOnDevice.ps1')) {
              if ($names -notcontains $required) { throw "Missing portable entry: $required" }
            }
            if (@($names | Where-Object { $_ -eq '.test-result' -or $_ -like 'package/*' }).Count -gt 0) { throw 'Unexpected file in portable archive.' }
          } finally { $zip.Dispose() }
          .\tests\Test-PortableUpdate.ps1 -Archive $portable -Version $version
          $lines = foreach ($path in @($installer, $portable)) {
            $file = (Resolve-Path $path).Path
            "$(Get-FileHash -LiteralPath $file -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $([IO.Path]::GetFileName($file))"
          }
          [IO.File]::WriteAllLines((Join-Path (Get-Location).Path 'dist\SHA256.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $installer = "dist/HytaleArabicInstaller-${{ steps.version.outputs.version }}.exe"
          $portable = "dist/HytaleArabicPortable-${{ steps.version.outputs.version }}.zip"
          $notes = @'
          ملف تثبيت ونسخة محمولة لتعريب هايتل 0.7.2. فك ضغط النسخة المحمولة كاملة، ثم افتح HytaleArabicManager.exe من المجلد الناتج؛ لا تحتاج إلى تثبيت. يفحص التطبيق تحديثات GitHub تلقائيًا ويختار نوع الملف الذي يوافق نسختك. يُنشئ التعريب من ملفات لعبتك الأصلية محليًا.

          لم يُختبر عرض هذا الإصدار داخل اللعبة آليًا. لا يضم الإصدار ملفات اللعبة أو خطوط Windows.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'hytale-release-notes.txt'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $portable dist/SHA256.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer $portable dist/SHA256.txt --target $env:GITHUB_SHA --title "تعريب هايتل ${{ steps.version.outputs.version }}" --notes-file $notesPath --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
