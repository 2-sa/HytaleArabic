name: Publish Windows installer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        id: version
        shell: pwsh
        run: |
          $version = "0.7.0.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Validate translation source
        shell: powershell
        run: |
          .\tests\Test-Catalogs.ps1
          .\tools\Test-MigrateTranslationSource.ps1
          .\tests\Test-GitHubUpdater.ps1
          foreach ($file in Get-ChildItem .\tools,.\tests -Filter '*.ps1' -Recurse -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Invalid PowerShell script: $($file.FullName)" }
          }
      - name: Build installer
        shell: powershell
        run: .\tools\Build-Installer.ps1 -OutputPath ".\dist\HytaleArabicInstaller-${{ steps.version.outputs.version }}.exe" -AppVersion "${{ steps.version.outputs.version }}"
      - name: Verify installer payload
        shell: powershell
        run: |
          $installer = (Resolve-Path ".\dist\HytaleArabicInstaller-${{ steps.version.outputs.version }}.exe").Path
          $extract = Join-Path (Get-Location).Path 'build\release-extraction'
          $process = Start-Process -FilePath $installer -ArgumentList @('--test-extract', $extract) -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Extraction failed: $($process.ExitCode)" }
          if (!(Test-Path -LiteralPath (Join-Path $extract '.test-result'))) { throw 'Extraction result missing.' }
          foreach ($required in @('HytaleArabicManager.exe','src\client.lang','src\server.lang','tools\PrepareOnDevice.ps1','tools\baseline-0.7.0.json')) {
            if (!(Test-Path -LiteralPath (Join-Path $extract $required))) { throw "Payload file missing: $required" }
          }
          if (Test-Path -LiteralPath (Join-Path $extract 'package')) { throw 'Release unexpectedly contains game assets.' }
          $version = [Reflection.AssemblyName]::GetAssemblyName($installer).Version.ToString()
          if ($version -ne '${{ steps.version.outputs.version }}') { throw "Unexpected installer version: $version" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          [IO.File]::WriteAllText((Join-Path (Get-Location).Path 'dist\SHA256.txt'), "$hash  $([IO.Path]::GetFileName($installer))`n", [Text.UTF8Encoding]::new($false))
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $installer = "dist/HytaleArabicInstaller-${{ steps.version.outputs.version }}.exe"
          $notes = @'
          مُثبّت مدير تعريب هايتل 0.7.0. يفحص التطبيق إصدارات GitHub تلقائيًا، ويعرض زر التحديث عند صدور نسخة أحدث. يتحقق من بصمة المُثبّت قبل فتحه. يُنشئ ملفات التعريب من نسختك الأصلية محليًا عند اختيار التثبيت داخل التطبيق. أغلق اللعبة والمشغّل قبل تعديل ملفات اللعبة.

          لم يُختبر عرض هذا الإصدار داخل اللعبة آليًا. يحتفظ المثبّت بالمصدر فقط ولا يضم ملفات اللعبة أو خطوط Windows.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'hytale-release-notes.txt'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer dist/SHA256.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer dist/SHA256.txt --target $env:GITHUB_SHA --title "تعريب هايتل ${{ steps.version.outputs.version }}" --notes-file $notesPath --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

