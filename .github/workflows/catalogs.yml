name: Catalog checks

on:
  push:
    paths:
      - 'src/**'
      - 'tests/Test-Catalogs.ps1'
      - 'tools/Migrate-TranslationSource.ps1'
      - 'tools/Test-MigrateTranslationSource.ps1'
      - 'tools/MessageTokens.cs'
      - '.github/workflows/catalogs.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/Test-Catalogs.ps1'
      - 'tools/Migrate-TranslationSource.ps1'
      - 'tools/Test-MigrateTranslationSource.ps1'
      - 'tools/MessageTokens.cs'
      - '.github/workflows/catalogs.yml'

jobs:
  catalogs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Arabic catalogs
        shell: powershell
        run: .\tests\Test-Catalogs.ps1
      - name: Validate update migration
        shell: powershell
        run: .\tools\Test-MigrateTranslationSource.ps1

